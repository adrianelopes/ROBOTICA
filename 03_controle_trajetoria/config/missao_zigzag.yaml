# Missão alternativa para a comparação: a orientação de cada waypoint NÃO aponta
# para o próximo, então os controladores precisam girar/andar de formas diferentes.
# Uso: ros2 launch controle_trajetoria waypoints.launch.py waypoints_file:=<este arquivo>
seguidor_waypoints:
  ros__parameters:
    waypoints: [z1, z2, z3, z4, z5]

    z1: {x: 1.0, y: 0.0, theta: 0.0}       # à frente
    z2: {x: 1.5, y: 1.0, theta: 1.5708}    # diagonal, virado para +y
    z3: {x: 0.0, y: 1.5, theta: 3.1416}    # atrás e à esquerda, virado para -x
    z4: {x: 0.5, y: 0.0, theta: -1.5708}   # para baixo, virado para -y
    z5: {x: 0.0, y: 0.0, theta: 0.0}       # volta à origem

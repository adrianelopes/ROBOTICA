pose_controller:                 
  ros__parameters:
    use_sim_time: true

    control_rate: 50.0           
    odom_topic: /odom
    goal_topic: /goal_pose       
    
    cmd_vel_topic: /cmd_vel

    pid_x:                       # e_x^b   velocidade linear v
      kp: 1.2
      ki: 0.0
      kd: 0.0
    pid_y:                       # e_y^b    velocidade angular w (soma com pid_theta)
      kp: 4.0
      ki: 1.0
      kd: 0.0
    pid_theta:                   # e_theta velocidade angular w (soma com pid_y)
      kp: 0.2
      ki: 0.0
      kd: 0.0

    max_linear_vel: 0.5          # m/s
    max_angular_vel: 1.5         # rad/s

    position_tolerance: 0.03     # m
    yaw_tolerance: 0.05          # rad

# /clock do Gazebo no SLAM: 1000 Hz (= passo da física, 1 ms).
# O padrão do gazebo_ros é 10 Hz: o now() dos nós em tempo simulado anda em degraus de
# 100 ms, e várias poses do groundtruth (50 Hz) saem com o mesmo carimbo de tempo. A TF
# odom -> chassis fica até 100 ms fora de sincronia com o /scan, e o SLAM vê erro de
# odometria mesmo no cenário sem ruído (~2 cm e ~1,3 graus de RMSE a 0,3 m/s).
gazebo:
  ros__parameters:
    publish_rate: 1000.0
